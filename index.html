<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b37"><title>飲み割り</title><link rel="icon" href="icon.svg"><style>body{font-family:system-ui,sans-serif;background:#eff5f5;color:#17343c;margin:0}main{max-width:520px;margin:auto;padding:18px}section{background:#fff;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 2px 12px #1232}h1{font-size:26px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}.line button{min-width:42px}button{border:0;border-radius:10px;padding:12px;background:#116d68;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.35}input[type=number]{box-sizing:border-box;width:100%;font-size:24px;padding:12px;border:1px solid #bbc;border-radius:10px}input[type=range]{width:100%}.muted{font-size:12px;color:#697b7c}.hidden{display:none}.result{font-size:19px;font-weight:700}.error{color:#a33}select{padding:8px}#results .line{border-bottom:1px solid #ddd;padding-bottom:10px}</style></head><body><main><header class="line"><h1>🍻 飲み割り</h1><button id="toggle">⚙ 設定</button></header><div id="home"><section><label>お会計合計（円）<input id="total" type="number" min="0" step="1" inputmode="numeric"></label><div id="people"></div></section><section><h2>計算結果</h2><div id="results"></div><div class="line"><button id="copy">コピー</button><button id="share">共有</button><button id="save">履歴保存</button></div></section><section><h2>履歴</h2><div id="history"></div></section></div><section id="settings" class="hidden"><h2>割引設定</h2><p>🍺 普通に飲んだ人：0% OFF</p><label>🍻 少し飲んだ人 <strong id="lightOut"></strong><input id="lightDiscount" type="range" min="0" max="100" step="5"></label><label>🥤 飲まない人 <strong id="noneOut"></strong><input id="noneDiscount" type="range" min="0" max="100" step="5"></label><p id="warning" class="error"></p><label>集金単位 <select id="unit"><option value="1">1円</option><option value="10">10円</option><option value="100">100円</option></select></label><p class="muted">合計額と一致させるため、集金単位未満の端数を一部の人に配分する場合があります。</p><button id="done">設定を保存して戻る</button></section><p class="muted">設定と履歴はこのブラウザ内に保存されます。</p></main><script src="app.js" defer></script></body></html>
